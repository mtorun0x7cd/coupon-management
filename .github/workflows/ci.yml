name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Lint and package
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.10'

      - name: Byte-compile sources
        run: python -m compileall -q src scripts tests

      - name: Package application
        run: |
          # Reproducible archive: normalize mtimes to the commit date and emit
          # entries in a stable order so repeated runs are byte-identical.
          export TZ=UTC LC_ALL=C
          SOURCE_DATE_EPOCH=$(git log -1 --pretty=%ct)
          paths="src scripts tests assets requirements.txt requirements-mongodb.txt LICENSE README.md"
          find $paths -exec touch --no-dereference --date="@$SOURCE_DATE_EPOCH" {} +
          find $paths | sort | zip -X -@ coupon-management.zip

      - name: Upload build artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: coupon-management
          path: coupon-management.zip
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: coupon-management

      - name: Publish release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          files: coupon-management.zip
          body: |
            Initial archived release (${{ github.ref_name }}) of Coupon Management Platform, an academic project preserved for reference. See the README for documentation.

            **Full Changelog**: https://github.com/mtorun0x7cd/coupon-management/commits/${{ github.ref_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
