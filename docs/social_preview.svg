<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
    <defs>
        <!-- Filter for glow effect -->
        <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
            <feDropShadow dx="0" dy="0" stdDeviation="12" flood-color="var(--accent)" flood-opacity="var(--glow-opacity)"/>
        </filter>
    </defs>

    <style>
        :root {
            --text-title: #0f172a;
            --text-subtitle: #475569;
            --text-badge: #475569;
            --accent: #2563eb;
            --badge-border: #cbd5e1;
            --glow-opacity: 0.05;
        }
        @media (prefers-color-scheme: dark) {
            :root {
                --text-title: #ffffff;
                --text-subtitle: #94a3b8;
                --text-badge: #64748b;
                --accent: #60a5fa;
                --badge-border: #334155;
                --glow-opacity: 0.25;
            }
        }
        .bg-border {
            stroke: var(--accent);
            stroke-opacity: 0.15;
        }
        .accent-stroke {
            stroke: var(--accent);
        }
        .accent-fill {
            fill: var(--accent);
        }
        .text-title {
            fill: var(--text-title);
        }
        .text-subtitle {
            fill: var(--text-subtitle);
        }
        .text-badge-dev {
            fill: var(--text-title);
        }
        .text-badge-gh {
            fill: var(--text-badge);
        }
        .badge-rect-dev {
            fill: var(--accent);
            fill-opacity: 0.12;
            stroke: var(--accent);
            stroke-opacity: 0.3;
        }
        .badge-rect-gh {
            stroke: var(--badge-border);
        }
        .divider {
            stroke: var(--accent);
        }
    </style>

    <!-- Outer border/frame -->
    <rect x="20" y="20" width="1160" height="590" rx="16" fill="none" class="bg-border" stroke-width="2"/>

    <!-- Centered Visual Icon group -->
    <g transform="translate(340, -91)" filter="url(#glow)">
        <!-- Relational table (SQL) -->
        <rect x="130" y="220" width="100" height="120" rx="8" fill="none" class="accent-stroke" stroke-width="6"/>
        <line x1="130" y1="260" x2="230" y2="260" class="accent-stroke" stroke-width="4"/>
        <line x1="130" y1="300" x2="230" y2="300" class="accent-stroke" stroke-width="4"/>

        <!-- Document (NoSQL) -->
        <rect x="270" y="260" width="120" height="100" rx="16" fill="none" class="accent-stroke" stroke-width="6"/>
        <circle cx="305" cy="310" r="12" class="accent-fill"/>
        <circle cx="355" cy="310" r="12" class="accent-fill"/>

        <!-- Connection & Performance curve -->
        <path d="M 180 340 C 210 420, 290 420, 330 360" fill="none" class="accent-stroke" stroke-width="6" stroke-dasharray="10 5"/>
    </g>

    <!-- Centered information block (Text) -->
    <g transform="translate(600, 360)">
        <!-- Project Title -->
        <text x="0" y="30" font-family="'SF Pro Display', -apple-system, 'Segoe UI', Roboto, Helvetica, sans-serif" font-size="28" font-weight="900" letter-spacing="1.2" class="text-title" text-anchor="middle">COUPON MANAGEMENT</text>

        <!-- Center-aligned Divider line -->
        <line x1="-200" y1="65" x2="200" y2="65" class="divider" stroke-width="3" stroke-linecap="round"/>

        <!-- Tagline / Subtitle -->
        <text x="0" y="110" font-family="'SF Pro Text', -apple-system, 'Segoe UI', Roboto, Helvetica, sans-serif" font-size="16" font-weight="500" class="text-subtitle" letter-spacing="0.5" text-anchor="middle">Polyglot Persistence (PostgreSQL vs. MongoDB) Benchmarking</text>

        <!-- Technical Domain Badge -->
        <g transform="translate(-187.5, 155)">
            <rect x="0" y="0" width="180" height="36" rx="8" class="badge-rect-dev" stroke-width="1.5"/>
            <text x="90" y="22" font-family="'SF Pro Text', -apple-system, 'Segoe UI', Roboto, Helvetica, sans-serif" font-size="12" font-weight="700" class="text-badge-dev" text-anchor="middle" letter-spacing="1">ACADEMIC ARCHIVE</text>
        </g>

        <!-- GitHub Handle Badge -->
        <g transform="translate(7.5, 155)">
            <rect x="0" y="0" width="180" height="36" rx="8" fill="none" class="badge-rect-gh" stroke-width="1.5"/>
            <text x="90" y="22" font-family="'SF Pro Text', -apple-system, 'Segoe UI', Roboto, Helvetica, sans-serif" font-size="12" font-weight="700" class="text-badge-gh" text-anchor="middle" letter-spacing="1">@mtorun0x7cd</text>
        </g>
    </g>
</svg>
